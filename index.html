<!DOCTYPE html>
<html>

<head>
    <title>Nisa Tesettür Barkod Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }

        .login-bg {
            background: #4f46e5;
            /* Static color for performance */
            background-size: 100% 100%;
        }

        /* Simplified static background for performance */

        .login-card {
            background-color: #ffffff;
            /* Removed backdrop-filter blur */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.3);
        }

        .custom-input {
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
        }

        .custom-input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
        }

        .pulse-button {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(123, 104, 238, 0.7);
            }

            70% {
                transform: scale(1.02);
                box-shadow: 0 0 0 10px rgba(123, 104, 238, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(123, 104, 238, 0);
            }
        }

        .noise-bg {
            display: none;
            /* Removed resource-intensive SVG filter */
        }

        /* CSS Rules cleaned for performance */

        .glowing-text {
            text-shadow: 0 0 5px rgba(139, 92, 246, 0.7),
                0 0 10px rgba(139, 92, 246, 0.5),
                0 0 15px rgba(139, 92, 246, 0.3);
        }

        .btn-animated {
            overflow: hidden;
            position: relative;
        }

        .btn-animated:after {
            display: none;
            /* Removed expensive shine animation */
        }
    </style>
</head>

<body class="bg-gradient-to-br from-indigo-500 to-purple-600">
    <div id="loginForm"
        class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden login-bg hidden">
        <div class="noise-bg"></div>

        <!-- Animated Background Elements -->
        <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-pink-300 rounded-full opacity-20 blur-3xl floating"
            style="animation-delay: 0s;"></div>
        <div class="absolute top-2/3 left-1/3 w-32 h-32 bg-blue-400 rounded-full opacity-20 blur-3xl floating"
            style="animation-delay: 0.5s;"></div>
        <div class="absolute top-1/3 right-1/4 w-48 h-48 bg-purple-400 rounded-full opacity-20 blur-3xl floating"
            style="animation-delay: 1s;"></div>
        <div class="absolute bottom-1/4 right-1/3 w-40 h-40 bg-indigo-300 rounded-full opacity-20 blur-3xl floating"
            style="animation-delay: 1.5s;"></div>

        <div class="login-card p-10 w-full max-w-md relative z-10">
            <div class="text-center mb-8">
                <div
                    class="inline-block p-4 rounded-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 mb-6 shadow-lg transform transition-all duration-500 hover:scale-105 floating">
                    <i class="fas fa-barcode text-white text-4xl"></i>
                </div>
                <h1
                    class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 glowing-text">
                    Nisa Tesettür</h1>
                <p class="text-gray-600 mt-2 text-lg">Barkod Yönetim Sistemi</p>
                <div class="mt-2 flex justify-center">
                    <span class="inline-block h-1 w-16 rounded bg-gradient-to-r from-pink-500 to-indigo-500"></span>
                </div>
            </div>

            <form id="loginFormElements" class="space-y-8">
                <div class="transform transition-all duration-300 hover:translate-x-2">
                    <label class="block text-gray-700 font-medium mb-2">Kullanıcı Adı</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i
                                class="fas fa-user text-gray-400 group-hover:text-purple-500 transition-colors duration-300"></i>
                        </div>
                        <input type="text" id="username"
                            class="custom-input w-full pl-12 pr-4 py-4 rounded-xl focus:outline-none shadow-sm group-hover:shadow-md transition-all">
                    </div>
                </div>

                <div class="transform transition-all duration-300 hover:translate-x-2">
                    <div class="flex justify-between mb-2">
                        <label class="block text-gray-700 font-medium">Şifre</label>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i
                                class="fas fa-lock text-gray-400 group-hover:text-purple-500 transition-colors duration-300"></i>
                        </div>
                        <input type="password" id="password"
                            class="custom-input w-full pl-12 pr-4 py-4 rounded-xl focus:outline-none shadow-sm group-hover:shadow-md transition-all">
                    </div>
                </div>

                <button type="submit"
                    class="btn-animated w-full py-4 px-6 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white font-medium rounded-xl 
                    transition-all hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50 transform hover:-translate-y-1">
                    <i class="fas fa-sign-in-alt mr-2"></i>Giriş Yap
                </button>
            </form>

            <div class="text-center mt-8">
                <p class="text-gray-600 text-sm">&copy; 2025 Nisa Tesettür - Tüm Hakları Saklıdır</p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="">
        <!-- Ana uygulama içeriği renderer.js tarafından doldurulacak -->
    </div>

    <!-- Add animated loading overlay for transitions -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white p-5 rounded-xl shadow-lg flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500 mb-3"></div>
            <p class="text-gray-700">Yükleniyor...</p>
        </div>
    </div>

    <!-- Custom animated notification system styles -->
    <style>
        @keyframes slideIn {
            0% {
                transform: translateX(100%);
                opacity: 0;
            }

            10% {
                transform: translateX(0);
                opacity: 1;
            }

            90% {
                transform: translateX(0);
                opacity: 1;
            }

            100% {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .notification {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            animation: slideIn 3s forwards;
            max-width: 24rem;
            backdrop-filter: blur(10px);
        }

        .notification.success {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.95), rgba(34, 197, 94, 0.95));
            color: white;
            border-left: 4px solid #16a34a;
        }

        .notification.error {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.95), rgba(220, 38, 38, 0.95));
            color: white;
            border-left: 4px solid #dc2626;
        }

        .notification.info {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.95), rgba(37, 99, 235, 0.95));
            color: white;
            border-left: 4px solid #2563eb;
        }

        /* Animated cards hover effect */
        .hover-card {
            transition: all 0.3s ease;
        }

        .hover-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Shimmer effect for buttons and cards */
        .shimmer-bg {
            position: relative;
            overflow: hidden;
        }

        .shimmer-bg::after {
            display: none;
            /* Removed continuous background animation */
        }

        /* Price tag style */
        .price-tag {
            position: relative;
            display: inline-block;
            padding: 0.5rem 0.75rem;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: bold;
            border-radius: 0.375rem;
        }

        .price-tag::before {
            content: '';
            position: absolute;
            top: 0;
            left: -0.5rem;
            width: 0.5rem;
            height: 0;
            border-right: 0.5rem solid #6366f1;
            border-top: 0.5rem solid transparent;
            border-bottom: 0.5rem solid transparent;
        }
    </style>

    <script src="./renderer.js"></script>
</body>

</html>
